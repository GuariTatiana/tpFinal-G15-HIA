services:
  db-primary:
    image: postgres:16-alpine
    container_name: futbolgest-db-primary
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./primary-init:/docker-entrypoint-initdb.d
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - replication-net

  db-replica:
    image: postgres:16-alpine
    container_name: futbolgest-db-replica
    user: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${REPLICATION_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./replica-init:/docker-entrypoint-initdb.d
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/01-setup-replica.sh"]
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    depends_on:
      - db-primary
    networks:
      - replication-net

  # Proxy TCP con failover: el backend de la app se conecta acá (pg-proxy:5432).
  # Enruta al primario; si cae, pasa a la réplica (backup) automáticamente.
  pg-proxy:
    image: haproxy:2.9-alpine
    container_name: futbolgest-pg-proxy
    restart: always
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5436:5432"   # acceso directo opcional para pruebas
    depends_on:
      - db-primary
      - db-replica
    networks:
      - replication-net
      - g15-app-net

  # Watchdog: promueve la réplica a primario si el primario deja de responder.
  failover-watchdog:
    image: postgres:16-alpine
    container_name: futbolgest-failover-watchdog
    user: postgres
    restart: always
    env_file:
      - .env
    volumes:
      - ./watchdog.sh:/watchdog.sh:ro
    entrypoint: ["/bin/bash", "/watchdog.sh"]
    depends_on:
      - db-primary
      - db-replica
    networks:
      - replication-net

volumes:
  primary_data:
  replica_data:

networks:
  replication-net:
    driver: bridge
  g15-app-net:
    external: true
    name: g15-app-net
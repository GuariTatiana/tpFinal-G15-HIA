global
    log stdout format raw local0
    maxconn 2000

    resolvers docker
        nameserver dns1 127.0.0.11:53
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s

defaults
    mode tcp
    log global
    option dontlognull
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    retries 3

frontend pg_in
    bind *:5432
    default_backend pg_out

backend pg_out
    option pgsql-check user postgres
    server db-primary db-primary:5432 check inter 5s fall 2 rise 2 resolvers docker init-addr none
    server db-replica db-replica:5432 check inter 5s fall 2 rise 2 backup resolvers docker init-addr none

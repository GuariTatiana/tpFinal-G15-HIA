global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas Sistema Operativo (CPU, RAM, Disco, Red)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Métricas Contenedores Docker (Estado, reinicios, recursos)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

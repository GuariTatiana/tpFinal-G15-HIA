services:
  traefik:
    image: traefik:v3.1
    container_name: nextcloud_traefik
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-8088}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    environment:
      - TRAEFIK_DOMAIN=${TRAEFIK_DOMAIN}
      - TRAEFIK_EMAIL=${TRAEFIK_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik_certificates:/certificates
    networks:
      - nextcloud_net

  db:
    image: postgres:16-alpine
    container_name: nextcloud_db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - nextcloud_net

  app:
    image: nextcloud:28-apache
    container_name: nextcloud_app
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - NEXTCLOUD_TRUSTED_DOMAINS=${TRAEFIK_DOMAIN} localhost 127.0.0.1 localhost:${NEXTCLOUD_PORT:-8080}
      - TRUSTED_PROXIES=traefik 127.0.0.1
      - APACHE_DISABLE_REWRITE_IP=1
      - TZ=${TZ}
    volumes:
      - nextcloud_data:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=letsencrypt"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-headers"
      - "traefik.http.routers.nextcloud-http.rule=Host(`${TRAEFIK_DOMAIN}`)"
      - "traefik.http.routers.nextcloud-http.entrypoints=web"
      - "traefik.http.routers.nextcloud-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.nextcloud-headers.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-headers.headers.stsPreload=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    networks:
      - nextcloud_net

  cron:
    image: nextcloud:28-apache
    container_name: nextcloud_cron
    restart: unless-stopped
    entrypoint: /cron.sh
    depends_on:
      - app
      - db
    volumes:
      - nextcloud_data:/var/www/html
    networks:
      - nextcloud_net

  backup:
    image: alpine:latest
    container_name: nextcloud_backup
    restart: unless-stopped
    depends_on:
      - db
      - app
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - nextcloud_backup:/backup
      - nextcloud_data:/var/www/html:ro
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache postgresql-client tzdata gzip tar findutils bash &&
      cp /usr/share/zoneinfo/\$TZ /etc/localtime && echo \"\$TZ\" > /etc/timezone &&
      echo '0 2 * * * /bin/sh /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1' > /etc/crontabs/root &&
      touch /var/log/backup.log &&
      echo 'Servicio de backup programado para las 02:00 AM diario.' &&
      crond -f -l 2
      "
    networks:
      - nextcloud_net

volumes:
  nextcloud_data:
    name: nextcloud_data
  db_data:
    name: db_data
  nextcloud_backup:
    name: nextcloud_backup
  traefik_certificates:
    name: traefik_certificates

networks:
  nextcloud_net:
    name: nextcloud_net
